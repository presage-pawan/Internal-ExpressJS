name: Internal dependency remediation

on:
  push:
    branches: ['priority/bugs']

permissions:
  contents: write

concurrency:
  group: internal-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.ref == 'refs/heads/priority/bugs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: priority/bugs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Detect nodemailer remediation
        id: deps
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const p=require('./package.json');
          const major=Number(String(p.dependencies?.nodemailer || '').match(/\d+/)?.[0] || 0);
          console.log('needs=' + (major < 10));
          NODE
      - name: Upgrade direct dependency and lock
        if: steps.deps.outputs.needs == 'true'
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.dependencies.nodemailer='10.2.1';
          fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify remediated graph
        if: steps.deps.outputs.needs == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm test
      - name: Commit verified dependency remediation
        if: steps.deps.outputs.needs == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): remediate Internal runtime audit"
          git push origin HEAD:priority/bugs

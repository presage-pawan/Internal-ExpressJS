name: Lockfile bootstrap
on:
  push:
    branches: ['priority/bugs']
permissions:
  contents: write
jobs:
  generate-lock:
    if: github.ref == 'refs/heads/priority/bugs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: priority/bugs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate lock when absent
        if: hashFiles('package-lock.json') == ''
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lock to priority branch only
        if: hashFiles('package-lock.json') == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): add deterministic package lock"
          git push origin HEAD:priority/bugs

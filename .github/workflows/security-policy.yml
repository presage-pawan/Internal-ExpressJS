name: Internal security policy validation

on:
  push:
    branches: ['priority/bugs']

permissions:
  contents: read

concurrency:
  group: internal-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-policy:
    if: github.ref == 'refs/heads/priority/bugs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: High-confidence current/history secret scan
        run: node scripts/secret-history-scan.cjs
      - name: Upload secret scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: internal-expressjs-secret-scan
          path: secret-scan.json
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture exact dependency audit
        run: |
          npm audit --omit=dev --json > npm-audit-runtime.json || true
          npm audit --json > npm-audit-all.json || true
          node -e "const r=require('./npm-audit-runtime.json'); if ((r.metadata?.vulnerabilities?.critical||0)>0) process.exit(1)"
      - name: Upload dependency audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: internal-express-npm-audit
          path: |
            npm-audit-runtime.json
            npm-audit-all.json
          if-no-files-found: ignore
      - name: Syntax check all JavaScript sources
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Security policy regression tests
        run: npm run test:security
      - name: Full Node test suite
        run: npm test
